services:
  backend:
    build:
      context: .
      dockerfile: src/VoresFamilie.Api/Dockerfile
    environment:
      Database__Provider: Sqlite
      ConnectionStrings__Default: Data Source=/data/vores-familie.db
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - data:/data
  frontend:
    build:
      context: .
      dockerfile: src/VoresFamilie.Web/Dockerfile
  proxy:
    image: caddy:2-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend
volumes:
  data:
